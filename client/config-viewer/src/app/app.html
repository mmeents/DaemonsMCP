<div class="app-container">
  <header class="app-header">
    <a routerLink="" routerLinkActive="active" class="logo-link">{{ title() }}</a>
    
    <div class="user-menu" *ngIf="currentUser">
      <a routerLink="/settings" class="user-name-link">
        <i class="pi pi-user"></i>
        <span class="user-name">{{ currentUser.displayName }}</span>
      </a>
      <p-button 
        icon="pi pi-sign-out" 
        label="Logout" 
        (onClick)="logout()"
        severity="secondary"
        [text]="true"
      ></p-button>
    </div>

    <!-- Show login button when not authenticated -->
    <div class="auth-buttons" *ngIf="!currentUser">
      <p-button 
        label="Login" 
        icon="pi pi-sign-in"
        (onClick)="goToLogin()"
        severity="secondary"
        [text]="true"
      ></p-button>
    </div>
  </header>

  <div class="app-body">
    <!-- Only show nav when logged in -->
    <nav class="app-nav" *ngIf="currentUser">
      <a routerLink="/projects" routerLinkActive="active" class="nav-link">
        <span class="nav-icon"><i class="pi pi-home"></i></span>
        <span class="nav-label">Projects</span>
      </a>
      <a routerLink="/files" routerLinkActive="active" class="nav-link">
        <span class="nav-icon"><i class="pi pi-file-check"></i></span>
        <span class="nav-label">Files</span>
      </a>
      <a routerLink="/items" routerLinkActive="active" class="nav-link">
        <span class="nav-icon"><i class="pi pi-palette"></i></span>
        <span class="nav-label">Items</span>
      </a>            
      <a routerLink="/users" routerLinkActive="active" class="nav-link">
        <span class="nav-icon"><i class="pi pi-eye"></i></span>
        <span class="nav-label">Users</span>
      </a>
      <a routerLink="/access-tokens" routerLinkActive="active" class="nav-link">
        <span class="nav-icon"><i class="pi pi-shield"></i></span>
        <span class="nav-label">Access</span>
      </a>
    </nav>
    
    <!-- Main content area - full width when not logged in -->
    <main class="app-main" [class.full-width]="!currentUser"> 
      <router-outlet />     
    </main>
  </div>
</div>
