<div class="app-container">
  <header class="app-header">
    <h1>{{ title() }}</h1>
    
    @if (selectedProject()) {
      <div class="project-selector">
        <label>Project:</label>
        <select 
          [value]="selectedProject()?.id"
          (change)="selectProject(projects()[$any($event.target).selectedIndex])"
        >
          @for (project of projects(); track project.id) {
            <option [value]="project.id">{{ project.name }}</option>
          }
        </select>
      </div>
    }
  </header>

  <main class="app-main">
    @if (loading()) {
      <div class="loading">Loading projects...</div>
    } @else if (error()) {
      <div class="error">{{ error() }}</div>
    } @else if (selectedProject()) {
      <div class="split-pane">
        <!-- Left: File Search -->
        <div class="search-pane">
          <app-searchable-list
            [items]="files"
            [loading]="searchLoading"
            [columns]="fileColumns"
            searchPlaceholder="Search files in {{ selectedProject()!.name }}..."
            emptyMessage="Type to search for files"
            noResultsMessage="No files found matching your search"
            (searchChanged)="onSearchChanged($event)"
            (itemSelected)="onFileSelected($event)"
          />
        </div>

        <!-- Right: File Viewer -->
        <div class="viewer-pane">
          <app-file-viewer
            [fileName]="selectedFileName"
            [filePath]="selectedFilePath"
            [fileContent]="fileContent"
            [loading]="fileLoading"
            [error]="fileError"
          />
        </div>
      </div>
    }
  </main>
</div>
