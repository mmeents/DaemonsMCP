<div class="settings-page">
  <div class="page-header">
    <h1>User Settings</h1>
    <p class="page-description">Manage your personal preferences and credentials</p>
  </div>

  <div class="settings-content">
    <p-tabs [(value)]="activeTab">
      <p-tablist>
        <p-tab value="0">Git Credentials</p-tab>
        <p-tab value="1" [disabled]="true">Profile</p-tab>
        <p-tab value="2" [disabled]="true">Preferences</p-tab>
      </p-tablist>

      <p-tabpanels>
        <p-tabpanel value="0">
          <app-git-credentials></app-git-credentials>
        </p-tabpanel>

        <p-tabpanel value="1">
          <div class="placeholder">
            <p>Profile settings coming soon...</p>
          </div>
        </p-tabpanel>

        <p-tabpanel value="2">
          <div class="placeholder">
            <p>User preferences coming soon...</p>
          </div>
        </p-tabpanel>
      </p-tabpanels>
    </p-tabs>
  </div>
</div>
