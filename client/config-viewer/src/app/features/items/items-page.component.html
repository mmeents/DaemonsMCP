<div class="items-page">
  <div class="split-pane">
    <!-- Left: Items Tree -->
    <div class="tree-pane">
      <div class="pane-header">
        <h2>Items Hierarchy</h2>
        <button class="btn-primary" (click)="onNewItem()">+ New Item</button>
      </div>
      <div class="tree-content">
        <app-items-tree
          [items]="items"
          [loading]="loading"
          (itemSelected)="onItemSelected($event)"
          (itemMoved)="onItemMoved($event)"
        >
        </app-items-tree>
      </div>
    </div>

    <!-- Right: Item Details -->
    <div class="details-pane">
      <div class="pane-header">
        <h2>Item Details</h2>
      </div>
      <div class="details-content">
        <div *ngIf="selectedItem; else noSelection">
          <h3>{{ selectedItem.name }}</h3>
          <p><strong>Type:</strong> {{ selectedItem.itemTypeName }}</p>
          <p><strong>Status:</strong> {{ selectedItem.statusTypeName }}</p>
          <p><strong>Details:</strong> {{ selectedItem.details }}</p>
          <p><strong>Created:</strong> {{ selectedItem.created | date }}</p>
        </div>
        <ng-template #noSelection>
          <p class="placeholder">Select an item to view details...</p>
        </ng-template>
      </div>
    </div>
  </div>
</div>
